[build-system]
requires = ["hatchling >= 1.21"]
build-backend = "hatchling.build"

[project]
name = "griphogram"
version = "0.1.0"
description = "Animated visualization of gradient flow across distributed ML graph topologies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = [
    "distributed-ml",
    "gradient-flow",
    "visualization",
    "graph-topology",
    "federated-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["Pillow >= 10.0"]

[project.optional-dependencies]
dev = ["pytest >= 8.0", "pytest-cov >= 5.0", "mypy >= 1.8", "ruff >= 0.3"]

[project.urls]
Homepage = "https://github.com/yourname/griphogram"
Documentation = "https://github.com/yourname/griphogram#readme"
Issues = "https://github.com/yourname/griphogram/issues"

[project.scripts]
griphogram = "griphogram.__main__:main"

# ── Hatch ──────────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/griphogram"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"src/griphogram/__main__.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["griphogram"]

